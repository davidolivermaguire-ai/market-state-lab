# Indices plus a fixed, pre-declared single-name list.
# The names are declared once and never edited to match today's index membership —
# that is what keeps the panel free of survivorship bias. Single names also stress
# the estimators properly: idiosyncratic vol and gaps behave nothing like an index.
name: trend_mixed
universe: mixed
start: "2010-01-01"
end: null

methods:
  # transparent baselines — the bar every sophisticated method must clear
  - ma_cross
  - return_sign
  - ewma_slope
  - always_range          # the null: never claims a trend
  # state estimators
  - kalman_trend
  - hmm_gaussian
  - ms_regression
  # change-point detectors — scored on timeliness, not classification
  - cusum
  - bocpd

engine:
  min_train: 750
  refit_every: 63         # raise to 126 to halve the ms_regression cost
  embargo: 5
  warmup: 750             # bounded run-up before each scored block
  max_train: 1250         # rolling (not expanding) fit window

output: results/trend_mixed
